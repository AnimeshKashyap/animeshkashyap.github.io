<svg xmlns="http://www.w3.org/2000/svg" viewBox="-18 -22 40 104">
  <!-- pivot (0,0) = knee. Starts 16 units ABOVE the knee (overlapping the
       thigh) with a transparent-to-solid fade (shinFade) that draws on top
       of the thigh's fade-out, so the two parts blend into one limb. -->
  <defs>
    <linearGradient id="shinFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2d4fa0" stop-opacity="0" />
      <stop offset="24%" stop-color="#2d4fa0" />
    </linearGradient>
  </defs>
  <circle id="pivot" cx="0" cy="0" r="0.01" fill="none" />
  <path d="M -9,-16 C -10,-4 -9,10 -8,24 C -7,42 -8,58 -9,70 L -9,78 L 9,78 L 9,70
           C 8,58 7,42 8,24 C 9,10 10,-4 9,-16 C 5,-20 -5,-20 -9,-16 Z"
        fill="url(#shinFade)" stroke="#14151a" stroke-width="1.5" stroke-opacity="0.85" />
  <rect class="cuff" x="-9" y="64" width="18" height="12" fill="#213a7c" opacity="0.9" />
</svg>

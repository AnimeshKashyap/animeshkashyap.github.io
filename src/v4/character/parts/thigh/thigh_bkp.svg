<svg xmlns="http://www.w3.org/2000/svg" viewBox="-18 -6 40 104">
  <!-- pivot (0,0) = hip. Tapered toward the knee; the bottom ~24% fades to
       transparent (thighFade) so it dissolves under the shin's top fade,
       giving the knee a soft overlapping joint instead of a hard seam. -->
  <defs>
    <linearGradient id="thighFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="76%" stop-color="#2d4fa0" />
      <stop offset="100%" stop-color="#2d4fa0" stop-opacity="0" />
    </linearGradient>
  </defs>
  <circle id="pivot" cx="0" cy="0" r="0.01" fill="none" />
  <path d="M -11,0 C -13,16 -12,36 -10,54 C -9,68 -8,82 -7,94 L 7,94 C 8,82 9,68 10,54
           C 12,36 13,16 11,0 C 6,-4 -6,-4 -11,0 Z"
        fill="url(#thighFade)" stroke="#14151a" stroke-width="1.5" stroke-opacity="0.85" />
</svg>

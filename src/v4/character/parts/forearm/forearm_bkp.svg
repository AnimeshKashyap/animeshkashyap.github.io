<svg xmlns="http://www.w3.org/2000/svg" viewBox="-14 -18 30 76">
  <!-- pivot (0,0) = elbow. The top ~24 units fade in a sleeve-colored cuff
       (blending with upper-arm.svg's fade-out); the rest is bare forearm
       skin down to the hand. -->
  <defs>
    <linearGradient id="cuffFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2d2f36" stop-opacity="0" />
      <stop offset="60%" stop-color="#2d2f36" />
    </linearGradient>
  </defs>
  <circle id="pivot" cx="0" cy="0" r="0.01" fill="none" />
  <path class="cuff-fade"
        d="M -7,-14 C -8,-4 -7,4 -6,10 L 6,10 C 7,4 8,-4 7,-14 C 4,-17 -4,-17 -7,-14 Z"
        fill="url(#cuffFade)" />
  <path class="forearm"
        d="M -6,4 C -6,16 -5,30 -4,40 L -4,46 L 4,46 L 4,40 C 5,30 6,16 6,4
           C 3,1 -3,1 -6,4 Z"
        fill="#e8a97a" stroke="#14151a" stroke-width="1.4" />
  <circle class="hand" cx="0" cy="48" r="7" fill="#d99264" stroke="#14151a" stroke-width="1.2" />
</svg>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Animesh Kashyap — Senior Software Engineer. Backend systems, cloud computing, and full-stack development." />
    <meta name="theme-color" content="#05070d" />
    <title>Animesh Kashyap — Principal Consultant</title>
    <script>
      // Set the theme before first paint so there's no flash of the wrong palette.
      (function () {
        try {
          var stored = localStorage.getItem('portfolio-theme');
          var theme = stored === 'light' || stored === 'dark'
            ? stored
            : (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

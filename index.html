<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Animesh Kashyap — Senior Software Engineer. Backend systems, cloud computing, and full-stack development." />
    <meta name="theme-color" content="#05070d" />
    <title>Animesh Kashyap — Senior Software Engineer</title>
    <script>
      // Set the theme before first paint so there's no flash of the wrong palette.
      (function () {
        try {
          var stored = localStorage.getItem('portfolio-theme');
          var theme = stored === 'light' || stored === 'dark'
            ? stored
            : (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
    <style>
      /* Phones/compact screens open the chat by default: cover the page until the chat is ready
         (released in src/chatbot/index.ts once the chat has faded in; the timeout below is a failsafe). */
      html.chatbot-booting::before { content: ''; position: fixed; inset: 0; z-index: 55; background: #05070d; }
      html.chatbot-booting::after { content: ''; position: fixed; top: 50%; left: 50%; width: 28px; height: 28px; margin: -14px 0 0 -14px; z-index: 56; box-sizing: border-box; border: 3px solid #5eead4; border-top-color: transparent; border-radius: 50%; animation: chatbot-boot-spin 800ms linear infinite; }
      html[data-theme='light'].chatbot-booting::before { background: #f5f6fb; }
      html[data-theme='light'].chatbot-booting::after { border-color: #7c3aed; border-top-color: transparent; }
      @keyframes chatbot-boot-spin { to { transform: rotate(360deg); } }
    </style>
    <script>
      (function () {
        if (!window.matchMedia('(max-width: 479px), (max-height: 499px)').matches) return;
        var root = document.documentElement;
        root.classList.add('chatbot-booting');
        setTimeout(function () { root.classList.remove('chatbot-booting'); }, 6000);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
